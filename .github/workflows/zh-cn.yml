name: zh-cn windows build

# 只为中文汉化版服务的工作流，分两个任务：
#   qm   (ubuntu)   : lupdate 抽取文案 -> 填词 -> lrelease 编译 .qm
#   win64(windows)  : 下载 .qm -> 编译 depthmapX.exe -> windeployqt 打包 -> 上传 artifact
#
# 为什么 .qm 在 Linux 上编译：Qt5 的 .qm 是平台无关的二进制格式；而 Windows 的
# Qt5 安装包（aqt）里没有 qttools 模块可装，lrelease 不一定存在。Linux 上
# qttools5-dev-tools 是确定可用的，因此把语言包的生成与平台解耦。
#
# 触发：向 zh-cn 分支推送，或手动 workflow_dispatch。

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

jobs:
  qm:
    name: build translations (zh_CN)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt5 linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qttools5-dev-tools

      - name: Extract strings (lupdate)
        run: |
          set -eu
          export PATH="/usr/lib/qt5/bin:$PATH"
          lupdate -version
          mkdir -p i18n
          lupdate -recursive depthmapX -ts i18n/depthmapX_zh_CN.ts
          echo "提取条目数: $(grep -c '<message' i18n/depthmapX_zh_CN.ts)"

      - name: Fill translations
        run: |
          python3 tools/fill_ts.py i18n/depthmapX_zh_CN.ts translations/depthmapX_zh_CN.json

      - name: Compile .qm
        run: |
          set -eu
          export PATH="/usr/lib/qt5/bin:$PATH"
          lrelease i18n/depthmapX_zh_CN.ts -qm i18n/depthmapX_zh_CN.qm
          ls -l i18n/

      - uses: actions/upload-artifact@v5
        with:
          name: depthmapX-zh_CN-qm
          path: i18n/depthmapX_zh_CN.qm
          if-no-files-found: error

  win64:
    name: build win64 (zh_CN)
    needs: qm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: depthmapX-zh_CN-qm
          path: i18n

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        shell: bash
        run: cmake --build build --config Release --target depthmapX --parallel 4

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p staging release-assets
          gui=$(find build/depthmapX -maxdepth 2 -name depthmapX.exe | head -1)
          echo "exe: $gui"
          cp "$gui" staging/
          windeployqt --release staging/depthmapX.exe
          mkdir -p staging/translations
          cp i18n/depthmapX_zh_CN.qm staging/translations/
          cp README-zh.md staging/ 2>/dev/null || true
          powershell -Command "Compress-Archive -Path staging/* -DestinationPath release-assets/depthmapX-0.10.0-zhCN_win64.zip -Force"
          ls -l release-assets

      - uses: actions/upload-artifact@v5
        with:
          name: depthmapX-zhCN-win64
          path: release-assets/*
          if-no-files-found: error
