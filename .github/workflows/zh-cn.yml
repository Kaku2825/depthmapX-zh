name: zh-cn windows build

# 只为中文汉化版服务的工作流：在 GitHub Actions 上完成
#   lupdate 抽取文案 -> 用 translations/depthmapX_zh_CN.json 填充 -> lrelease 编译 .qm
#   -> 编译 depthmapX.exe -> windeployqt 打包 -> 上传 artifact
# 触发：向 zh-cn 分支推送，或手动 workflow_dispatch。

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

jobs:
  win64:
    name: build win64 (zh_CN)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt5 with linguist tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          modules: 'qttools'

      - name: Verify linguist tools
        shell: bash
        run: |
          set -eu
          if ! command -v lrelease >/dev/null || ! command -v lupdate >/dev/null; then
            echo "::error::lrelease/lupdate 未安装（需要 qttools 模块）"
            exit 1
          fi
          lrelease -version
          lupdate -version

      - name: Extract strings (lupdate)
        shell: bash
        run: |
          set -eu
          mkdir -p i18n
          lupdate -recursive depthmapX -ts i18n/depthmapX_zh_CN.ts
          echo "提取条目数: $(grep -c '<message' i18n/depthmapX_zh_CN.ts)"

      - name: Fill translations
        shell: bash
        run: python tools/fill_ts.py i18n/depthmapX_zh_CN.ts translations/depthmapX_zh_CN.json

      - name: Compile .qm
        shell: bash
        run: |
          set -eu
          lrelease i18n/depthmapX_zh_CN.ts -qm i18n/depthmapX_zh_CN.qm
          ls -l i18n

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI
        shell: bash
        run: cmake --build build --config Release --target depthmapX --parallel 4

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p staging release-assets
          gui=$(find build/depthmapX -maxdepth 2 -name depthmapX.exe | head -1)
          echo "exe: $gui"
          cp "$gui" staging/
          windeployqt --release staging/depthmapX.exe
          mkdir -p staging/translations
          cp i18n/depthmapX_zh_CN.qm staging/translations/
          cp README-zh.md staging/ 2>/dev/null || true
          powershell -Command "Compress-Archive -Path staging/* -DestinationPath release-assets/depthmapX-0.10.0-zhCN_win64.zip -Force"
          ls -l release-assets

      - uses: actions/upload-artifact@v5
        with:
          name: depthmapX-zhCN-win64
          path: release-assets/*
          if-no-files-found: error
